<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EDECC 個案接案報告助手 (離線結構化及 AI 輔助版)</title>
  <style>
    :root {
      --bg: #f5f5f2;
      --card: #ffffff;
      --section-bg: #fafaf8;
      --primary: #2b594c;
      --primary-hover: #1e4238;
      --primary-light: #e6f0ec;
      --accent: #d47230;
      --accent-hover: #b85d20;
      --warn-bg: #fff8eb;
      --warn-border: #edd29f;
      --warn-text: #8c5311;
      --text: #28302d;
      --muted: #636e69;
      --border: #d8dedb;
      --radius-lg: 10px;
      --radius-md: 7px;
      --radius-sm: 5px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Microsoft JhengHei", "PingFang HK", "Noto Sans TC", sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    header {
      background: var(--primary);
      color: #ffffff;
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
    }

    header h1 {
      margin: 0;
      font-size: 1.2rem;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .api-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      background: rgba(255, 255, 255, 0.12);
      padding: 6px 12px;
      border-radius: var(--radius-md);
      font-size: 0.84rem;
    }

    .api-bar label {
      font-weight: 500;
    }

    .api-bar input,
    .api-bar select {
      padding: 5px 8px;
      border-radius: var(--radius-sm);
      border: 1px solid rgba(255, 255, 255, 0.35);
      font-size: 0.84rem;
      width: auto;
      background: #ffffff;
      color: var(--text);
    }

    .api-bar button {
      background: #ffffff;
      color: var(--primary);
      border: none;
      padding: 5px 11px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-weight: 600;
      font-size: 0.84rem;
      transition: background 0.15s ease;
    }

    .api-bar button:hover {
      background: var(--primary-light);
    }

    .main-container {
      display: grid;
      grid-template-columns: 1.18fr 0.82fr;
      gap: 20px;
      max-width: 1520px;
      margin: 18px auto;
      padding: 0 18px 40px;
    }

    @media (max-width: 1080px) {
      .main-container {
        grid-template-columns: 1fr;
      }
      .sticky-panel {
        position: static !important;
        height: 620px !important;
      }
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 18px 20px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.03);
    }

    .demo-banner {
      background: var(--warn-bg);
      border: 1px solid var(--warn-border);
      border-radius: var(--radius-md);
      padding: 10px 14px;
      margin-bottom: 14px;
      font-size: 0.85rem;
    }

    .demo-banner-title {
      font-weight: 700;
      color: var(--warn-text);
      margin-bottom: 6px;
    }

    .demo-btn-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .case-mode-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
    }

    .mode-card {
      flex: 1;
      border: 2px solid var(--border);
      border-radius: var(--radius-md);
      padding: 9px 14px;
      cursor: pointer;
      background: #ffffff;
      font-weight: 600;
      font-size: 0.92rem;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.15s ease;
    }

    .mode-card.active {
      border-color: var(--primary);
      background: var(--primary-light);
      color: var(--primary);
    }

    .section-box {
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 13px 15px;
      margin-bottom: 13px;
      background: var(--section-bg);
    }

    .section-title {
      margin: 0 0 10px 0;
      font-size: 0.96rem;
      font-weight: 700;
      color: var(--primary);
      border-bottom: 2px solid var(--primary-light);
      padding-bottom: 4px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
    }

    @media (max-width: 680px) {
      .grid-2,
      .grid-3 {
        grid-template-columns: 1fr;
      }
    }

    .field {
      margin-bottom: 10px;
    }

    .field:last-child {
      margin-bottom: 0;
    }

    .field-label {
      display: block;
      font-size: 0.83rem;
      font-weight: 600;
      margin-bottom: 4px;
      color: var(--text);
    }

    input[type="text"],
    input[type="password"],
    select,
    textarea {
      width: 100%;
      padding: 7px 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 0.88rem;
      font-family: inherit;
      background: #ffffff;
      color: var(--text);
    }

    input[type="text"]:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(43, 89, 76, 0.12);
    }

    textarea {
      resize: vertical;
      min-height: 52px;
    }

    .chip-group {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 3px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 4px 9px;
      font-size: 0.83rem;
      cursor: pointer;
      user-select: none;
      transition: all 0.12s ease;
    }

    .chip:hover {
      border-color: var(--primary);
      background: var(--primary-light);
    }

    .chip input {
      margin: 0;
      cursor: pointer;
    }

    .btn-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .btn {
      padding: 9px 15px;
      border-radius: var(--radius-md);
      border: none;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.15s ease, opacity 0.15s ease;
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
      flex: 1.3;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--primary-hover);
    }

    .btn-fast {
      background: var(--accent);
      color: #ffffff;
      flex: 1;
    }

    .btn-fast:hover:not(:disabled) {
      background: var(--accent-hover);
    }

    .btn-outline {
      background: #ffffff;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 5px 10px;
      font-size: 0.82rem;
    }

    .btn-outline:hover:not(:disabled) {
      background: #eef1ef;
      border-color: var(--primary);
    }

    .sticky-panel {
      position: sticky;
      top: 16px;
      display: flex;
      flex-direction: column;
      height: calc(100vh - 36px);
    }

    #reportOutput {
      flex: 1;
      width: 100%;
      font-family: "Microsoft JhengHei", "PingFang HK", sans-serif;
      font-size: 0.94rem;
      line-height: 1.65;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: #fcfcfb;
      white-space: pre-wrap;
      resize: none;
    }

    .status-badge {
      font-size: 0.82rem;
      padding: 4px 10px;
      border-radius: 20px;
      background: var(--primary-light);
      color: var(--primary);
      font-weight: 600;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

<header>
  <h1>📋 長者地區中心 (EDECC) 個案接案報告助手</h1>
  <div class="api-bar">
    <label for="apiUrl">AnythingLLM 網址:</label>
    <input type="text" id="apiUrl" value="http://localhost:3001" style="width: 155px;" />
    <label for="apiKey">API Key:</label>
    <input type="password" id="apiKey" placeholder="本機 API Key (選填)" style="width: 145px;" />
    <button type="button" id="btnLoadWorkspaces">1. 讀取工作區</button>
    <select id="workspaceSlug" aria-label="選擇 AnythingLLM 工作區" style="min-width: 145px;">
      <option value="">-- 請先讀取工作區 --</option>
    </select>
    <span id="connStatus">未連線</span>
  </div>
</header>

<main class="main-container">
  <!-- 左側：結構化輸入表單 -->
  <section class="panel">
    <div class="demo-banner">
      <div class="demo-banner-title">
        ⚠️ 測試與演示環境提示：請僅輸入虛擬測試資料（Dummy Data），切勿輸入真實個人私隱資料。
      </div>
      <div class="demo-btn-group">
        <span>一鍵載入標準測試個案：</span>
        <button type="button" class="btn btn-outline" data-dummy="1">
          🧪 個案一（同住中風＋睡少於5小時＋缺失留白）
        </button>
        <button type="button" class="btn btn-outline" data-dummy="2">
          🧪 個案二（認知障礙＋嗜睡＋外傭分擔）
        </button>
        <button type="button" class="btn btn-outline" data-dummy="3">
          🧪 個案三（獨居長者＋看更支援）
        </button>
      </div>
    </div>

    <div class="panel-header">
      <strong>步驟一：選擇個案類別與填寫評估項目</strong>
      <button type="button" class="btn btn-outline" id="btnResetForm">🧹 清空表單</button>
    </div>

    <!-- 個案模式切換 -->
    <div class="case-mode-bar">
      <label class="mode-card active" id="modeFamilyCard">
        <input type="radio" name="caseMode" value="family" checked />
        👨‍👩‍👧 同住／有照顧者個案 (/intake)
      </label>
      <label class="mode-card" id="modeSoloCard">
        <input type="radio" name="caseMode" value="solo" />
        🏠 獨居長者個案 (/intake-solo)
      </label>
    </div>

    <!-- 1. 背景與求助目標 -->
    <div class="section-box">
      <div class="section-title">1. 背景資料與申請服務目標</div>
      <div class="grid-3">
        <div class="field">
          <label class="field-label" for="occupation">退休前職業 (自動刪去「前」字)</label>
          <input type="text" id="occupation" placeholder="例：老師 / 侍應 / 家庭主婦" />
        </div>
        <div class="field">
          <label class="field-label" for="livingArrangement">婚姻及同住安排</label>
          <input type="text" id="livingArrangement" placeholder="例：案主與太太兩老同住" />
        </div>
        <div class="field">
          <label class="field-label" for="targetService">申請目標服務</label>
          <select id="targetService">
            <option value="輪候長期護理服務">輪候長期護理服務</option>
            <option value="CCSV服務">CCSV服務</option>
            <option value="輪候長期護理服務及CCSV服務">輪候長期護理服務及CCSV服務</option>
            <option value="RCS及CCS服務">RCS及CCS服務</option>
          </select>
        </div>
      </div>
    </div>

    <!-- 2. 健康、行動與自理 -->
    <div class="section-box">
      <div class="section-title">2. 健康狀況（慢病、病歷、行動、如廁、餐膳）</div>
      <div class="field">
        <span class="field-label">慢性疾病 (可多選及補充)</span>
        <div class="chip-group">
          <label class="chip"><input type="checkbox" class="disease-cb" value="高血壓" /> 高血壓</label>
          <label class="chip"><input type="checkbox" class="disease-cb" value="糖尿病" /> 糖尿病</label>
          <label class="chip"><input type="checkbox" class="disease-cb" value="膽固醇過高" /> 膽固醇過高</label>
          <label class="chip"><input type="checkbox" id="cbThreeHighs" /> ⚡ 一鍵勾選「三高」</label>
          <label class="chip"><input type="checkbox" class="disease-cb" value="骨質疏鬆" /> 骨質疏鬆</label>
          <label class="chip"><input type="checkbox" class="disease-cb" value="哮喘" /> 哮喘</label>
          <label class="chip"><input type="checkbox" class="disease-cb" value="心臟病" /> 心臟病</label>
          <label class="chip"><input type="checkbox" class="disease-cb" value="白內障" /> 白內障</label>
        </div>
        <input type="text" id="diseaseExtra" placeholder="其他慢病補充（例：痛風、柏金遜症，以頓號分隔）" style="margin-top: 6px;" />
      </div>

      <div class="grid-2">
        <div class="field">
          <label class="field-label" for="hospital">主要覆診醫院</label>
          <select id="hospital">
            <option value="東區醫院">東區醫院</option>
            <option value="律敦治醫院">律敦治醫院</option>
            <option value="東區醫院及律敦治醫院">東區醫院及律敦治醫院</option>
            <option value="瑪麗醫院">瑪麗醫院</option>
            <option value="普通科門診">普通科門診</option>
            <option value="[待補充：覆診醫院]">未提及 (標示待補充)</option>
            <option value="custom">其他醫院 (手動輸入)</option>
          </select>
          <input type="text" id="hospitalCustom" class="hidden" placeholder="請輸入覆診醫院或診所全名" style="margin-top: 6px;" />
        </div>
        <div class="field">
          <label class="field-label" for="majorMedicalEvent">引發事件／中風／跌倒／出入院經過</label>
          <input type="text" id="majorMedicalEvent" placeholder="例：2025年9月中風致左邊身無力" />
        </div>
      </div>

      <div class="grid-2">
        <div class="field">
          <label class="field-label" for="indoorMobility">家中（室內）行動方式</label>
          <select id="indoorMobility">
            <option value="可用拐杖">可用拐杖</option>
            <option value="可用拐杖及一人扶行">可用拐杖及一人扶行</option>
            <option value="可用助行架">可用助行架</option>
            <option value="可自如走動">可自如走動</option>
            <option value="需一人扶行">需一人扶行</option>
            <option value="需坐輪椅">需坐輪椅</option>
            <option value="[待補充：家中行動能力]">未提及 (標示待補充)</option>
          </select>
        </div>
        <div class="field">
          <label class="field-label" for="outdoorMobility">外出行動方式</label>
          <select id="outdoorMobility">
            <option value="坐輪椅">坐輪椅</option>
            <option value="使用拐杖">使用拐杖</option>
            <option value="使用助行架">使用助行架</option>
            <option value="需一人扶行">需一人扶行</option>
            <option value="自如走動">自如走動</option>
            <option value="[待補充：外出行動能力]">未提及 (標示待補充)</option>
          </select>
        </div>
      </div>

      <div class="grid-3">
        <div class="field">
          <label class="field-label" for="adlStatus">ADL 及 IADL 自理情況</label>
          <input type="text" id="adlStatus" value="ADL 案主可大致自理，IADL則由太太協助" />
        </div>
        <div class="field">
          <label class="field-label" for="toiletStatus">如廁及尿片使用</label>
          <select id="toiletStatus">
            <option value="沒有失禁，無需使用尿片">沒有失禁，無需使用尿片</option>
            <option value="暫時未見有問題，僅於晚上穿戴尿片">暫時未見有問題，僅於晚上穿戴尿片</option>
            <option value="僅於外出或晚上穿戴尿片">僅於外出或晚上穿戴尿片</option>
            <option value="有失禁情況，日常需穿著尿片">有失禁情況，日常需穿著尿片</option>
            <option value="[待補充：如廁及尿片情況]">未提及 (標示待補充)</option>
          </select>
        </div>
        <div class="field">
          <label class="field-label" for="dietType">餐膳種類</label>
          <select id="dietType">
            <option value="[待補充：餐膳種類]">未提及 (標示待補充)</option>
            <option value="正常餐">正常餐</option>
            <option value="碎餐">碎餐</option>
            <option value="淋餐">淋餐</option>
            <option value="免治餐">免治餐</option>
            <option value="糊餐">糊餐</option>
          </select>
        </div>
      </div>
    </div>

    <!-- 3. 情緒、認知與睡眠 -->
    <div class="section-box">
      <div class="section-title">3. 情緒、認知與睡眠邏輯</div>
      <div class="grid-2">
        <div class="field">
          <label class="field-label" for="cognitiveStatus">認知與聽力溝通情況</label>
          <input type="text" id="cognitiveStatus" value="案主認知能力正常，可與工作員正常對答" />
        </div>
        <div class="field">
          <label class="field-label" for="emotionStatus">情緒與精神科紀錄</label>
          <input type="text" id="emotionStatus" value="案主情緒穩定，沒有精神科覆診記錄" />
        </div>
      </div>
      <div class="grid-2">
        <div class="field">
          <label class="field-label" for="sleepType">睡眠狀態類別 (自動對應日間精神描述)</label>
          <select id="sleepType">
            <option value="good">1. 睡眠充足／睡好（睡醒後感覺有精神）</option>
            <option value="poor">2. 睡眠不足(少於5小時)／夜尿難復睡（睡醒後仍感疲倦，日間精神欠佳）</option>
            <option value="hypersomnia">3. 嗜睡情況（即使休息時間長，睡醒後及日間仍感昏昏欲睡、精神疲倦）</option>
            <option value="missing">4. 未提及 (標示待補充)</option>
          </select>
        </div>
        <div class="field">
          <label class="field-label" for="sleepDetail">睡眠時段／時數／夜尿補充</label>
          <input type="text" id="sleepDetail" placeholder="例：11pm - 6am 或 12am - 4am睡覺（僅睡約4小時），夜尿後難復睡" />
        </div>
      </div>
    </div>

    <!-- 4. 親人關係及照顧者壓力 -->
    <div class="section-box">
      <div class="section-title">4. 親人關係與護老者照顧狀況</div>
      <div class="grid-3" id="familyCarerRow">
        <div class="field">
          <label class="field-label" for="mainCarer">主要照顧者稱謂</label>
          <select id="mainCarer">
            <option value="太太">太太</option>
            <option value="案夫">案夫</option>
            <option value="大女">大女</option>
            <option value="二女">二女</option>
            <option value="三女">三女</option>
            <option value="案女">案女</option>
            <option value="大子">大子</option>
            <option value="二子">二子</option>
            <option value="細仔">細仔</option>
            <option value="案子">案子</option>
          </select>
        </div>
        <div class="field">
          <label class="field-label" for="carerRelation">與主要照顧者關係</label>
          <select id="carerRelation">
            <option value="良好">良好</option>
            <option value="緊密而良好">緊密而良好</option>
            <option value="一般">一般</option>
          </select>
        </div>
        <div class="field">
          <label class="field-label" for="carerStress">照顧者壓力程度</label>
          <select id="carerStress">
            <option value="high">感到吃力，照顧壓力較大</option>
            <option value="low_maid">有傭人分擔照顧，照顧壓力不大</option>
            <option value="low_coop">案主尚算配合，照顧壓力不大</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label class="field-label" for="otherFamilyNotes">其他親人或同住傭人關係（列入「與護老者或其他親人的關係」欄，可多行）</label>

  };

  const el = {};
  const cacheElements = () => {
    const ids = [
      'apiUrl', 'apiKey', 'btnLoadWorkspaces', 'workspaceSlug', 'connStatus',
      'btnResetForm', 'modeFamilyCard', 'modeSoloCard', 'familyCarerRow', 'soloSupportField',
      'occupation', 'livingArrangement', 'targetService', 'cbThreeHighs', 'diseaseExtra',
      'hospital', 'hospitalCustom', 'majorMedicalEvent', 'indoorMobility', 'outdoorMobility',
      'adlStatus', 'toiletStatus', 'dietType', 'cognitiveStatus', 'emotionStatus',
      'sleepType', 'sleepDetail', 'mainCarer', 'carerRelation', 'carerStress',
      'otherFamilyNotes', 'informalSupportNotes', 'allowance', 'netFamily', 'netMaid',
      'extraNotes', 'btnInstantDraft', 'btnAiGenerate', 'reportOutput', 'genStatus', 'btnCopyReport'
    ];
    ids.forEach(id => {
      el[id] = document.getElementById(id);
    });
  };

  const normalizeTerms = (raw) => {
    if (!raw) return '';
    return String(raw)
      .trim()
      .replace(/妻子/g, '太太')
      .replace(/大仔/g, '大子')
      .replace(/二仔/g, '二子')
      .replace(/三仔/g, '三子')
      .replace(/過世/g, '過身')
      .replace(/（LTC）/gi, '')
      .replace(/\(LTC\)/gi, '');
  };

  const stripTrailingPunctuation = (str) => {
    return normalizeTerms(str).replace(/[。；;，,、.]+$/, '');
  };

  const stripLeadingBullet = (str) => {
    return normalizeTerms(str).replace(/^[－\-•*]+\s*/, '');
  };

  const formatMultiLineBullets = (rawText) => {
    if (!rawText || !rawText.trim()) return '';
    return rawText
      .split(/\r?\n/)
      .map(line => stripTrailingPunctuation(stripLeadingBullet(line)))
      .filter(Boolean)
      .map(line => `－ ${line}。`)
      .join('\n');
  };

  const formatOccupationSentence = (rawJob) => {
    const job = stripTrailingPunctuation(rawJob);
    if (!job) return '案主曾任職[待補充：退休前職業]。';
    if (job.includes('主婦')) return '案主婚後為家庭主婦。';
    const stripped = job.replace(/^前/, '').replace(/^任職/, '').replace(/^曾任職/, '');
    return `案主曾任職${stripped}。`;
  };

  const getCheckedValues = (selector) => {
    return Array.from(document.querySelectorAll(`${selector}:checked`)).map(cb => cb.value);
  };

  const setCheckedValues = (selector, valuesArray) => {
    const valSet = new Set(valuesArray || []);
    document.querySelectorAll(selector).forEach(cb => {
      cb.checked = valSet.has(cb.value);
    });
  };

  const updateModeUI = (mode) => {
    const isSolo = (mode === 'solo');
    el.modeFamilyCard.classList.toggle('active', !isSolo);
    el.modeSoloCard.classList.toggle('active', isSolo);
    el.modeFamilyCard.querySelector('input').checked = !isSolo;
    el.modeSoloCard.querySelector('input').checked = isSolo;

    el.familyCarerRow.classList.toggle('hidden', isSolo);
    el.soloSupportField.classList.toggle('hidden', !isSolo);
  };

  const applyState = (state) => {
    updateModeUI(state.caseMode);
    el.occupation.value = state.occupation;
    el.livingArrangement.value = state.livingArrangement;
    el.targetService.value = state.targetService;

    setCheckedValues('.disease-cb', state.diseases);
    el.cbThreeHighs.checked = THREE_HIGHS_LIST.every(d => state.diseases.includes(d));
    el.diseaseExtra.value = state.diseaseExtra;

    el.hospital.value = state.hospital;
    el.hospitalCustom.value = state.hospitalCustom;
    el.hospitalCustom.classList.toggle('hidden', state.hospital !== 'custom');

    el.majorMedicalEvent.value = state.majorMedicalEvent;
    el.indoorMobility.value = state.indoorMobility;
    el.outdoorMobility.value = state.outdoorMobility;
    el.adlStatus.value = state.adlStatus;
    el.toiletStatus.value = state.toiletStatus;
    el.dietType.value = state.dietType;

    el.cognitiveStatus.value = state.cognitiveStatus;
    el.emotionStatus.value = state.emotionStatus;
    el.sleepType.value = state.sleepType;
    el.sleepDetail.value = state.sleepDetail;

    el.mainCarer.value = state.mainCarer;
    el.carerRelation.value = state.carerRelation;
    el.carerStress.value = state.carerStress;
    el.otherFamilyNotes.value = state.otherFamilyNotes;
    el.informalSupportNotes.value = state.informalSupportNotes;

    el.allowance.value = state.allowance;
    setCheckedValues('.bath-cb', state.bathFacilities);
    setCheckedValues('.net-cb', state.supportNetwork);
    el.extraNotes.value = state.extraNotes;
  };

  const readCurrentState = () => {
    const modeRadio = document.querySelector('input[name="caseMode"]:checked');
    return {
      caseMode: modeRadio ? modeRadio.value : 'family',
      occupation: el.occupation.value,
      livingArrangement: el.livingArrangement.value,
      targetService: el.targetService.value,
      diseases: getCheckedValues('.disease-cb'),
      diseaseExtra: el.diseaseExtra.value,
      hospital: el.hospital.value,
      hospitalCustom: el.hospitalCustom.value,
      majorMedicalEvent: el.majorMedicalEvent.value,
      indoorMobility: el.indoorMobility.value,
      outdoorMobility: el.outdoorMobility.value,

      toiletStatus: el.toiletStatus.value,
      dietType: el.dietType.value,
      cognitiveStatus: el.cognitiveStatus.value,
      emotionStatus: el.emotionStatus.value,

      sleepDetail: el.sleepDetail.value,
      mainCarer: el.mainCarer.value,

      carerStress: el.carerStress.value,

  const buildSleepSentence = (sleepType, rawDetail) => {
    const detail = stripTrailingPunctuation(rawDetail);
    if (sleepType === 'missing') {
      return '－ [待補充：睡眠作息情況]。';
    }
    if (sleepType === 'hypersomnia') {
      return '－ 案主有嗜睡情況，即使休息時間長，睡醒後及日間仍感昏昏欲睡、精神疲倦。';
    }
    if (sleepType === 'poor') {
      const timeStr = detail
        ? (detail.includes('睡覺') ? `每日大約${detail}` : `每日大約${detail}睡覺`)

      return `－ ${timeStr}，睡眠時間不足，睡醒後仍感疲倦，日間精神欠佳。`;

    const goodTimeStr = detail
      ? (detail.includes('睡覺') ? `每日大約${detail}` : `每日大約${detail}睡覺`)

－ ${jobSentence}
－ ${livingClean}。

－ ${majorEventClean}。

－ ${adlClean}。
－ 如廁上案主${state.toiletStatus}。
－ 餐膳上案主可以食用${state.dietType}。

情緒狀況（精神病記錄／暴力傾向／虐待記錄）：
－ ${cogClean}。
－ ${emoClean}。
${sleepSentence}

與護老者或其他親人的關係：
${formattedOtherFamily || '－ 案主與家人關係疏離。'}

護老者的能力及情緒狀況：
－ 案主獨居，與家人關係疏離，現時未有正式護老者。${informalLine}

－ 案主正領取${state.allowance}，另有積蓄，暫無經濟困難。

支援網絡／對外聯絡／其他機構提供服務：
${netBlock}

跟進計劃：*
${followUpServiceLine}
－ 跟進案主身心狀況`;
    }

    const hasMaidSupport = state.carerStress === 'low_maid' || state.supportNetwork.includes('傭人');

      carerStressSentence = `${state.mainCarer}表示照顧上感到吃力，照顧壓力較大。`;
    } else if (state.carerStress === 'low_maid') {
      carerStressSentence = `有傭人分擔照顧，${state.mainCarer}表示照顧壓力不大。`;
    } else {
      carerStressSentence = `案主尚算配合，${state.mainCarer}表示照顧壓力不大。`;
    }

    const extraFamilyLines = formattedOtherFamily ? `\n${formattedOtherFamily}` : '';

    return `求助問題：*
案主因${majorEventClean}，現時身體及自理能力退化。${carerProblemClause}，故欲為其申請${state.targetService}。

家庭圖：
[插入家庭圖]

背景資料：*
－ ${jobSentence}
－ ${livingClean}。

健康狀況（日常獨立及自我照顧能力）：
－ 案主患${diseaseStr}，主要於${hospitalStr}覆診。
－ ${majorEventClean}。
－ 案主家中${state.indoorMobility}，外出則需${state.outdoorMobility}。
－ ${adlClean}。
－ 如廁上案主${state.toiletStatus}。
${dietSentence}

情緒狀況（精神病記錄／暴力傾向／虐待記錄）：
－ ${cogClean}。
－ ${emoClean}。
${sleepSentence}

與護老者或其他親人的關係：
－ ${state.mainCarer}：同住，為主要照顧者，關係${state.carerRelation}。${extraFamilyLines}

護老者的能力及情緒狀況：
－ ${state.mainCarer}為主要照顧者，主力照顧案主的起居及日常家務。${carerStressSentence}

經濟狀況：
－ 案主正領取${state.allowance}，另有積蓄，暫無經濟困難。

居住狀況：
－ 家居環境整潔，雜物已妥善放置。
－ 浴室備有${bathStr}。

支援網絡／對外聯絡／其他機構提供服務：
${netBlock}

跟進計劃：*
${followUpServiceLine}
－ 跟進案主身心狀況
－ 關顧護老者照顧狀況`;
  };

  const handleInstantDraft = () => {
    const state = readCurrentState();
    el.reportOutput.value = compileReportText(state);
    el.genStatus.textContent = '⚡ 已產生即時初稿';
  };

  const loadWorkspaces = async (preselectSlug = '') => {
    const baseUrl = el.apiUrl.value.trim().replace(/\/$/, '');
    const apiKey = el.apiKey.value.trim();

    if (!apiKey) {
      alert('請先在上方輸入 AnythingLLM API Key！');
      return;
    }

    try {
      el.connStatus.textContent = '連線中...';
      const response = await fetch(`${baseUrl}/api/v1/workspaces`, {
        headers: { 'Authorization': `Bearer ${apiKey}` }
      });

      if (!response.ok) {
        throw new Error(`HTTP 狀態碼 ${response.status}`);
      }

      const data = await response.json();
      el.workspaceSlug.innerHTML = '';

      (data.workspaces || []).forEach(ws => {
        const opt = document.createElement('option');
        opt.value = ws.slug;
        opt.textContent = `${ws.name} (${ws.slug})`;
        el.workspaceSlug.appendChild(opt);
      });

      if (preselectSlug && Array.from(el.workspaceSlug.options).some(o => o.value === preselectSlug)) {
        el.workspaceSlug.value = preselectSlug;
      }

      localStorage.setItem(STORAGE_KEYS.URL, baseUrl);
      localStorage.setItem(STORAGE_KEYS.KEY, apiKey);
      if (el.workspaceSlug.value) {
        localStorage.setItem(STORAGE_KEYS.SLUG, el.workspaceSlug.value);
      }

      el.connStatus.textContent = '🟢 已連線';
    } catch (err) {
      el.connStatus.textContent = '🔴 連線失敗';
      const isHttpsToLocal = window.location.protocol === 'https:' && baseUrl.startsWith('http://localhost');
      const hint = isHttpsToLocal
        ? '\n\n提示：您目前透過 HTTPS (例如 GitHub Pages) 開啟網頁，瀏覽器預設會封鎖連線至本機 http://localhost:3001。若需連結本機 AnythingLLM，請將 index.html 下載至電腦桌面直接開啟，即可正常連線。'
        : '';
      alert(`無法連線至 AnythingLLM：${err.message}${hint}`);
    }
  };

  // 送交 AnythingLLM：使用獨立 sessionId 隔離記憶，並對齊【輸出結構】標籤
  const handleAiGenerate = async () => {
    const baseUrl = el.apiUrl.value.trim().replace(/\/$/, '');
    const apiKey = el.apiKey.value.trim();
    const slug = el.workspaceSlug.value;

    if (!apiKey || !slug) {
      alert('請先在頂部輸入 API Key 並點擊「1. 讀取工作區」！（若無須使用 AI 潤飾，可直接點擊橙色「⚡ 1. 即時組合標準初稿」按鈕）');
      return;
    }

    const state = readCurrentState();
    const baseDraft = compileReportText(state);
    const extraClean = stripTrailingPunctuation(state.extraNotes);

    const promptForQwen = `請嚴格按照以下【輸出結構】完整輸出11個標準標題及所有條列內容（必須100%保留11個標題名稱、保留「[待補充：...]」字眼，直接由「求助問題：*」開始輸出，切勿刪減任何標題）：

【輸出結構】
${baseDraft}${extraClean ? `\n\n【社工速記內容（請將此補充自然融入上述對應欄位中，保持11個標題結構不變）】：\n${extraClean}。` : ''}`;

    try {
      el.btnAiGenerate.disabled = true;
      el.genStatus.textContent = '🤖 Qwen3-4B 生成中 (約需 2-3 分鐘)...';
      el.reportOutput.value = '正在由本機 Qwen3-4B-Instruct 生成報告中，請稍候...\n\n（提示：您亦隨時可點擊左側「⚡ 1. 即時組合標準初稿」取得 0 秒免等待版本）';

      const response = await fetch(`${baseUrl}/api/v1/workspace/${slug}/chat`, {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${apiKey}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          message: promptForQwen,
          mode: 'chat',
          sessionId: `edecc-case-${Date.now()}`
        })
      });

      if (!response.ok) {
        throw new Error(`HTTP 狀態碼 ${response.status}`);
      }

      const data = await response.json();
      const cleanedOutput = (data.textResponse || '')
        .replace(/<think>[\s\S]*?<\/think>/gi, '')
        .trim();

      // 安全防線：若模型輸出少於8個標準標題，自動回退至完整確定性初稿
      const requiredHeaders = ['求助問題：*', '背景資料：*', '健康狀況', '情緒狀況', '經濟狀況：', '居住狀況：', '跟進計劃：*'];
      const hasAllHeaders = requiredHeaders.every(h => cleanedOutput.includes(h));

      if (!hasAllHeaders) {
        el.reportOutput.value = baseDraft;
        el.genStatus.textContent = '⚡ 已自動鎖定標準11項格式';
      } else {
        el.reportOutput.value = cleanedOutput;
        el.genStatus.textContent = '✅ AI 潤飾完成';
      }
    } catch (err) {
      el.genStatus.textContent = '⚠️ AI 連線異常 (已切換為標準初稿)';
      el.reportOutput.value = baseDraft;
      alert(`呼叫 AnythingLLM 失敗 (${err.message})，系統已自動為您輸出零幻覺標準初稿。`);
    } finally {
      el.btnAiGenerate.disabled = false;
    }
  };

  const handleCopyReport = async () => {
    const content = el.reportOutput.value.trim();
    if (!content) return;

    try {
      await navigator.clipboard.writeText(content);
    } catch {
      el.reportOutput.select();
      document.execCommand('copy');
    }
    el.genStatus.textContent = '📋 已複製到剪貼簿！';
  };

  const bindEvents = () => {
    document.querySelectorAll('input[name="caseMode"]').forEach(radio => {
      radio.addEventListener('change', (e) => {
        const newMode = e.target.value;
        updateModeUI(newMode);
        el.netFamily.checked = (newMode === 'family');
        if (newMode === 'solo' && el.adlStatus.value === DEFAULT_STATE.adlStatus) {
          el.adlStatus.value = '案主ADL及部分IADL可自理';
        } else if (newMode === 'family' && el.adlStatus.value === '案主ADL及部分IADL可自理') {
          el.adlStatus.value = DEFAULT_STATE.adlStatus;
        }
      });
    });

    el.cbThreeHighs.addEventListener('change', (e) => {
      const isChecked = e.target.checked;
      document.querySelectorAll('.disease-cb').forEach(cb => {
        if (THREE_HIGHS_LIST.includes(cb.value)) {
          cb.checked = isChecked;
        }
      });
    });

    document.querySelectorAll('.disease-cb').forEach(cb => {
      cb.addEventListener('change', () => {
        const currentDiseases = getCheckedValues('.disease-cb');
        el.cbThreeHighs.checked = THREE_HIGHS_LIST.every(d => currentDiseases.includes(d));
      });
    });

    el.hospital.addEventListener('change', () => {
      const isCustom = el.hospital.value === 'custom';
      el.hospitalCustom.classList.toggle('hidden', !isCustom);
      if (isCustom) el.hospitalCustom.focus();
    });

    el.carerStress.addEventListener('change', () => {
      if (el.carerStress.value === 'low_maid') {
        el.netMaid.checked = true;
      }
    });

    document.querySelectorAll('[data-dummy]').forEach(btn => {
      btn.addEventListener('click', () => {
        const caseId = Number(btn.getAttribute('data-dummy'));
        if (DUMMY_CASES[caseId]) {
          applyState(DUMMY_CASES[caseId]);
          handleInstantDraft();
          el.genStatus.textContent = `🧪 已載入測試個案 ${caseId}`;
        }
      });
    });

    el.btnResetForm.addEventListener('click', () => {
      if (confirm('確定要清空目前表單內容以輸入新個案嗎？')) {
        applyState(DEFAULT_STATE);
        el.reportOutput.value = '';
        el.genStatus.textContent = '已清空';
      }
    });

    el.btnLoadWorkspaces.addEventListener('click', () => loadWorkspaces());
    el.workspaceSlug.addEventListener('change', () => {
      localStorage.setItem(STORAGE_KEYS.SLUG, el.workspaceSlug.value);
    });

    el.btnInstantDraft.addEventListener('click', handleInstantDraft);
    el.btnAiGenerate.addEventListener('click', handleAiGenerate);
    el.btnCopyReport.addEventListener('click', handleCopyReport);
  };

  document.addEventListener('DOMContentLoaded', () => {
    cacheElements();
    bindEvents();
    applyState(DEFAULT_STATE);

    const savedUrl = localStorage.getItem(STORAGE_KEYS.URL);
    const savedKey = localStorage.getItem(STORAGE_KEYS.KEY);
    const savedSlug = localStorage.getItem(STORAGE_KEYS.SLUG);

    if (savedUrl) el.apiUrl.value = savedUrl;
    if (savedKey) {
      el.apiKey.value = savedKey;
      loadWorkspaces(savedSlug || '');
    }
  });
})();
</script>
</body>
</html>
